name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat test

  web:
    name: Web type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Placeholder so the full app is bundled: with the address unset, Vite
      # constant-folds it to "" and dead-code-eliminates everything behind the
      # "Setup required" notice, leaving nothing to build-test.
      VITE_GOALPOT_ADDRESS: "0x0000000000000000000000000000000000000001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
